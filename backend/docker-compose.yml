version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hacknex_postgres
    restart: always
    environment:
      POSTGRES_DB: vision_behaviour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vision_behaviour"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hacknex_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/vision_behaviour
      - UPLOAD_DIR=./storage/videos
      - OUTPUT_DIR=./storage/processed
      - EVIDENCE_DIR=./storage/evidence
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","*"]
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_storage:
